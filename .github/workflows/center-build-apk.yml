name: Build Center APK

# ملف واحد يكفي: يحمل المشروع كاملاً بداخله ويستعيده تلقائياً إن لم تكن ملفاته في المستودع.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore project files
