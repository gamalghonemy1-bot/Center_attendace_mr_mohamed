            --out /tmp/signed.apk "$OUT/app-release.apk"
          "$AS" verify --print-certs /tmp/signed.apk | head -3
          cp -f /tmp/signed.apk "$OUT/app-release.apk"
          echo "APK re-signed with stable key."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: center-attendance-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
