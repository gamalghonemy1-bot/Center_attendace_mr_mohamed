      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name center_attendance --org com.attendance.center .
          rm -rf test
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter\.minSdkVersion/23/' "$f"
            fi
          done
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$M"
          fi
          sed -i 's#android:label="[^"]*"#android:label="حضور السنتر"#' "$M"

          # ترقية Kotlin إلى 2.1.0 على الأقل (المكتبات الحديثة تحتاجه)
          S=android/settings.gradle
          [ -f "$S" ] || S=android/settings.gradle.kts
          CUR=$(grep -oE 'org\.jetbrains\.kotlin\.android"\)? *version *"[0-9.]+' "$S" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "Kotlin plugin in template: ${CUR:-unknown}"
          if [ -n "$CUR" ] && [ "$(printf '%s\n' 2.1.0 "$CUR" | sort -V | head -1)" != "2.1.0" ]; then
            sed -i -E 's/(org\.jetbrains\.kotlin\.android"\)? *version *")[0-9.]+/\12.1.0/' "$S"
            echo "Kotlin plugin upgraded to 2.1.0"
          fi
          echo "---- settings:"; cat "$S"

      - name: Get packages
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

